      <circle cx="500" cy="400" r="300" fill="#BFE4F5"/>
      <path d="M278 142c58-30 122-32 180-8 26 10 26 34 6 52-24 22-28 58-8 84 20 28 12 58-20 72-34 16-52 46-44 80 10 40-6 74-42 94-42 22-90 12-120-22-32-36-30-82 4-114 26-26 28-60 12-92-18-36-6-76 32-104z" fill="#86C254"/>
      <path d="M414 520c30-18 64-10 84 18 16 24 12 52-10 70-26 20-58 12-72-16-14-30-14-56-2-72z" fill="#86C254"/>
      <path d="M200 314c32-16 64-8 82 18M292 596c34-10 66 2 84 28" fill="none" stroke="#FFF6E6" stroke-width="7" stroke-linecap="round" opacity=".55"/>
      <path d="M240 200c18-10 38-12 56-6M300 368c22-8 42-4 58 10M214 470c20-6 38 0 50 14" fill="none" stroke="#FFF6E6" stroke-width="5" stroke-linecap="round" opacity=".45"/>

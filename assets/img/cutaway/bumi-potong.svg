<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="cutaway-title cutaway-desc">
  <title id="cutaway-title">Potongan bumi</title>
  <desc id="cutaway-desc">Bumi dipotong pada sepertiga bagian. Sisi kiri memperlihatkan permukaan dengan benua dan laut; sisi kanan memperlihatkan kerak tipis, mantel, inti luar, dan inti dalam.</desc>
  <defs>
    <clipPath id="globe">
      <circle cx="500" cy="400" r="300"/>
    </clipPath>
    <clipPath id="left-half">
      <rect x="180" y="80" width="320" height="640"/>
    </clipPath>
    <pattern id="speckle" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="2" fill="#FFF6E6" opacity=".18"/>
      <circle cx="19" cy="18" r="1.5" fill="#16262B" opacity=".2"/>
    </pattern>
  </defs>

  <ellipse cx="500" cy="738" rx="310" ry="26" fill="#557187" opacity=".22"/>

  <g clip-path="url(#globe)">

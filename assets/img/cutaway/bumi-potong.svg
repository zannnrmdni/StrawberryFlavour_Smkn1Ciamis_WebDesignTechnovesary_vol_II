    <circle cx="500" cy="400" r="294" fill="#E0612F"/>
    <circle cx="500" cy="400" r="190" fill="#F2A33C"/>
    <circle cx="500" cy="400" r="120" fill="#F7E3A1"/>
    <circle cx="500" cy="400" r="300" fill="url(#speckle)"/>

    <circle cx="500" cy="400" r="294" fill="none" stroke="#16262B" stroke-width="3" stroke-dasharray="10 10" opacity=".55"/>
    <path d="M500 106c-58 92-22 152 34 214s58 128 6 206M500 106c44 84 18 148-28 204s-44 130-4 206M216 258c76 26 134 66 168 118M734 574c-70-14-126-48-160-100" fill="none" stroke="#16262B" stroke-width="3" opacity=".2"/>

